<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teste de integração — Buscador de candidatos</title>
    <style>
      :root {
        color: #25221f;
        background: #f7f5f2;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .portal-test-page {
        max-width: 1500px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }

      .test-heading {
        border-bottom: 3px solid #ff5a00;
        margin-bottom: 20px;
        padding-bottom: 16px;
      }

      .test-heading__eyebrow {
        color: #c54400;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 6px;
        text-transform: uppercase;
      }

      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(28px, 4vw, 42px);
        margin: 0;
      }

      .test-heading p {
        line-height: 1.55;
        margin: 10px 0 0;
        max-width: 780px;
      }

      .terra-eleicoes-embed {
        background: #fffdfb;
        box-shadow: 0 10px 34px rgb(38 27 20 / 8%);
        overflow: hidden;
        width: 100%;
      }

      .terra-eleicoes-embed iframe {
        background: #fffdfb;
        border: 0;
        display: block;
        height: 1320px;
        width: 100%;
      }

      @media (max-width: 760px) {
        .portal-test-page {
          padding: 22px 0 32px;
        }

        .test-heading {
          margin: 0 16px 18px;
        }

        .terra-eleicoes-embed iframe {
          height: 1480px;
        }
      }
    </style>
  </head>
  <body>
    <main class="portal-test-page">
      <header class="test-heading">
        <p class="test-heading__eyebrow">Ambiente de homologação</p>
        <h1>Buscador de candidatos</h1>
        <p>
          Página de teste para validar o carregamento do buscador dentro do portal.
          A rolagem continua disponível dentro do quadro quando necessário.
        </p>
      </header>

      <section class="terra-eleicoes-embed" aria-label="Buscador de candidatos das eleições de 2026">
        <iframe
          src="https://candidatos-lqrmtjns.manus.space/"
          title="Buscador de candidatos — Eleições no Terra"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="clipboard-read; clipboard-write"
        ></iframe>
      </section>
    </main>
  </body>
</html>
